spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  main:
    banner-mode: off

payments:
  psp:
    retry:
      backoff: 1ms
  webhook:
    secrets: whsec_test_current,whsec_test_previous
  outbox:
    relay:
      enabled: false

logging:
  level:
    org.apache.kafka: warn
    kafka: warn
    org.apache.zookeeper: warn
